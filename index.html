<html lang="ja">

<style>
:root{color-scheme:dark;--blue:#1e6bff;--cy:#34d3ff;--red:#ff2d4a;--yel:#ffd21e;--grn:#2cff7a;--ink:#040818;--f:'Dela Gothic One','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;--n:'Russo One','Arial Black',Impact,sans-serif;--tc:var(--blue)}
*{box-sizing:border-box}

.tm.r{--c:var(--red);border-left:2px solid #8aa3dc;border-right:8px solid var(--c);text-align:right}
.tm.on{opacity:1}

.tm small{display:block;font-family:var(--n);letter-spacing:.2em;font-size:clamp(10px,2.4vw,14px);color:var(--c);filter:brightness(1.5)}
.tm b{display:block;font-family:var(--n);font-size:clamp(30px,8vw,56px);line-height:1;text-shadow:0 0 14px var(--c)}

#combo{position:fixed;left:50%;top:34%;z-index:5;transform:translateX(-50%);font-family:var(--n);font-size:clamp(34px,9vw,80px);font-style:italic;color:var(--yel);text-shadow:0 4px 0 #a35b00,0 0 30px #ff9d00;pointer-events:none;animation:cb .7s ease-out both}
@keyframes cb{0%{transform:translateX(-50%) scale(.4);opacity:0}25%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1) translateY(-30px);opacity:0}}

world.timestep=1/120;

const M=(c,r=.5,m=.1,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e?c:0,emissiveIntensity:e});
const NEON=[0x1e6bff,0xff2d4a,0xffd21e,0x2cff7a];
const mat={wall:M(0xb9c4dc,.35,.5),lane:M(0xe0b070,.3,.1),bump:null,plate:M(0xffd21e,.4,.3,.45),ramp:M(0x2cff7a,.5,.2,.35),pin:M(0xffffff,.3),stripe:M(0xe03030,.4),gut:M(0x080c1e,.9,0,0)};
function gridTex(rx,ry,c1,c2){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle=c1;g.fillRect(0,0,128,128);g.strokeStyle=c2;g.lineWidth=5;g.strokeRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;return t}
const floorM=(rx,ry)=>new THREE.MeshStandardMaterial({map:gridTex(rx,ry,'#0b1a48','#2f7bff'),roughness:.35,metalness:.3});

const obs=new Map(),ballCols=new Set();
function box(w,h,d,x,y,z,m,ry=0,rz=0,rest=.5){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);

  ring.rotation.x=Math.PI/2;ring.position.set(x,h*.85,z);scene.add(ring);

}
const spinners=[];
function spinner(x,z,w){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,.8,.3),mat.plate);
  mesh.position.set(x,.5,z);scene.add(mesh);
  const b=world.createRigidBody(RAPIER.RigidBodyDesc.kinematicVelocityBased().setTranslation(x,.5,z).setAngvel({x:0,y:x<0?2.2:-2.2,z:0}));
  {const col=world.createCollider(RAPIER.ColliderDesc.cuboid(w/2,.4,.15).setRestitution(.8).setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS),b);obs.set(col.handle,[420,'sawtooth'])}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,1,16),M(0xffffff,.3,.6));hub.position.set(x,.5,z);scene.add(hub);
  spinners.push({mesh,b});

box(14,.5,42,0,-.25,-19,floorM(7,21));
box(18,.5,12,0,-.25,-46,floorM(9,6));
box(14.6,.5,42,0,-.25,-73,mat.lane);

box(.5,1.5,42,-7.25,.75,-19,mat.wall);box(.5,1.5,42,7.25,.75,-19,mat.wall);

box(.4,1.5,10.08,7.65,.75,-45,mat.wall,-.129);box(.4,1.5,10.08,-7.65,.75,-45,mat.wall,.129);
box(.5,1.5,12,-9.25,.75,-46,mat.wall);box(.5,1.5,12,9.25,.75,-46,mat.wall);
box(.4,1.6,42,-8.5,.3,-73,mat.wall);box(.4,1.6,42,8.5,.3,-73,mat.wall);

box(3.2,1,.4,-5.8,.5,-3.8,mat.wall,.54);box(3.2,1,.4,5.8,.5,-3.8,mat.wall,-.54);
[[-3,-8],[3,-8],[0,-11.5],[-4.8,-13],[4.8,-13],[0,-16]].forEach(p=>bumper(...p));
spinner(-3.5,-21,3.2);spinner(3.5,-21,3.2);

[[-4,1,0],[4,-1,Math.PI]].forEach(([x,sign,ph])=>{
  const ox=x<0?-2.5:2.5,P=[[ox,-.15,3],[-ox,-.15,1],[-ox,-.15,-3],[ox,-.15,-1],[ox,.15,3],[-ox,.15,1],[-ox,.15,-3],[ox,.15,-1]];
  const idx=[4,5,6,4,6,7,0,3,2,0,2,1,0,1,5,0,5,4,1,2,6,1,6,5,2,3,7,2,7,6,3,0,4,3,4,7];
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(P.flat()),3));geo.setIndex(idx);geo.computeVertexNormals();
  const rm=M(0x2cff7a,.5,.2,.35);rm.side=THREE.DoubleSide;
  const m=new THREE.Mesh(geo,rm);m.position.set(x,.15,-28);scene.add(m);
  const ta=sign*.3,ts=Math.sin(ta/2),tc=Math.cos(ta/2);m.quaternion.set(0,0,ts,tc);
  const b=world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(x,.15,-28).setRotation({x:0,y:0,z:ts,w:tc}));
  const col=world.createCollider(RAPIER.ColliderDesc.convexHull(new Float32Array(P.flat())).setRestitution(.5).setFriction(.3).setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS),b);obs.set(col.handle,[220,'triangle']);

box(.5,1.2,6,0,.6,-34,mat.wall);
bumper(-4,-37);bumper(4,-37);bumper(0,-23.5);
bumper(-5.2,-18.5);bumper(5.2,-18.5);
function peg(x,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.9,14),M(0xd0d8ee,.3,.7));m.position.set(x,.45,z);scene.add(m);const b=world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(x,.45,z));world.createCollider(RAPIER.ColliderDesc.cylinder(.45,.25).setRestitution(1).setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Max),b)}

spinner(0,-28,2.4);
box(3.9,1,.4,-5.75,.5,-32.5,mat.wall,.88);box(3.9,1,.4,5.75,.5,-32.5,mat.wall,-.88);
const sliders=[];
{const m=new THREE.Mesh(new THREE.BoxGeometry(2.6,.9,.4),M(0xff2d4a,.4,.3,.5));scene.add(m);const b=world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0,.5,-39.2));{const col=world.createCollider(RAPIER.ColliderDesc.cuboid(1.3,.45,.2).setRestitution(.8).setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS),b);obs.set(col.handle,[500,'square'])}sliders.push({b,m,z:-39.2,amp:4.2,sp:1.7})}
const GZ=-18,GW=1.6;
const gateMat=new THREE.MeshBasicMaterial({color:0xffd21e,transparent:true,opacity:.28,side:THREE.DoubleSide});

  }
  if(ball){const p=ball.translation(),q=ball.rotation();ballMesh.position.set(p.x,p.y,p.z);ballMesh.quaternion.set(q.x,q.y,q.z,q.w)}
  for(const p of pins){const tr=p.body.translation(),q=p.body.rotation();p.mesh.position.set(tr.x,tr.y,tr.z);p.mesh.quaternion.set(q.x,q.y,q.z,q.w)}
  if(fPins){const L=fPins.list;let ch=false;for(let i=0;i<L.length;i++){const q=L[i],sl=q.body.isSleeping();if(sl&&q.sync)continue;const tr=q.body.translation(),r=q.body.rotation();dummyP.position.set(tr.x,tr.y,tr.z);dummyP.quaternion.set(r.x,r.y,r.z,r.w);dummyP.updateMatrix();fPins.inst.setMatrixAt(q.i,dummyP.matrix);q.sync=sl;ch=true}if(ch)fPins.inst.instanceMatrix.needsUpdate=true}
  for(const s of spinners){const q=s.b.rotation();s.mesh.quaternion.set(q.x,q.y,q.z,q.w)}
  for(const e of extras){const p=e.b.translation(),q=e.b.rotation();e.m.position.set(p.x,p.y,p.z);e.m.quaternion.set(q.x,q.y,q.z,q.w)}
  if(ballSkin==='rainbow'){const h=(now/1000*.5)%1,m=ballMesh.material;m.color.setHSL(h,1,.5);m.emissive.setHSL(h,1,.4);m.emissiveIntensity=.35}
  updateCrowd(now,dt);updateCam(dt,now);
  renderer.render(scene,cam);
}

/* ---------- 入力 ---------- */
function setMode(f){FEVER=f;TOTAL=f?300:100;TURNS=f?1:3;roulettes.forEach((r,i)=>{r.on=i===0||f;r.mat.map=f?rTexF:rTex;r.mat.needsUpdate=true})}
$('startBtn').onclick=()=>{setMode(false);ctx();startBGM();intro()};
$('feverBtn').onclick=()=>{setMode(true);ctx();startBGM();intro()};
$('toStart').onclick=()=>{$('final').classList.add('hide');$('shareBox').classList.add('hide');$('start').classList.remove('hide');state='start'};
$('again').onclick=()=>{$('final').classList.add('hide');intro()};
$('next').onclick=()=>{match.turn<TURNS-1?nextTurn():showFinal()};
function stopOrFire(){if(state!=='aim')return;if(phase===0){phase=1;$('fire').textContent='角度をストップ！発射';beep(660,.1,'square',.05)}else fire()}
$('fire').onclick=stopOrFire;
addEventListener('keydown',e=>{
  if(state!=='aim')return;
  if(e.key==='ArrowLeft')ang.value=+ang.value-1;
  else if(e.key==='ArrowRight')ang.value=+ang.value+1;
  else if(e.key==='ArrowUp')pos.value=+pos.value+.3;
  else if(e.key==='ArrowDown')pos.value=+pos.value-.3;
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();stopOrFire();return}
  else return;
  updateGuide();
});

makePins();makeBall();updateGuide();hud();showRank();
$('startBtn').disabled=false;$('startBtn').textContent='チャレンジスタート';$('feverBtn').disabled=false;
requestAnimationFrame(loop);
</script>
